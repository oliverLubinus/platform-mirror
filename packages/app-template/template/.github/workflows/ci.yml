# The {{APP_TITLE}} repo CI — mirrors the platform gates (typecheck/test/build).
# Contract-first OpenAPI drift gate, permission-catalog check, and the
# pre-commit quality suite are live from the scaffold (R-PKG-09/R-PKG-11).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # M1 registry flip: @agentic-dna/* resolves from npm.pkg.github.com
      # (see .npmrc) — the lockfile pins GitHub Packages tarball URLs, so the
      # install needs a read token. No platform-sibling checkout, no link:.
      - uses: pnpm/action-setup@v4
        # version resolved from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # GitHub Packages auth for @agentic-dna/* (lockfile pins npm.pkg.github.com
      # tarballs). pnpm IGNORES env-expanded credentials in the repo .npmrc
      # (supply-chain hardening), so the token goes into the user-level
      # ~/.npmrc, which is trusted. PACKAGES_READ_TOKEN = fine-grained PAT
      # with read:packages (owner-created); falls back to the workflow's own
      # GITHUB_TOKEN.
      - name: "Configure GitHub Packages auth (user-level ~/.npmrc)"
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The jsxDEV lesson (documented in the platform skill + PM runbook):
      # Vite's isProduction follows process.env.NODE_ENV, not build mode — an
      # unset NODE_ENV silently emits a dev-JSX bundle that crashes at load.
      - name: Build (NODE_ENV=production forced)
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Bundle-secret scan (post-build)
        run: pnpm check:bundle-secrets
