# The template app repo CI — mirrors the platform gates (typecheck/test/build).
# Contract-first OpenAPI drift gate, permission-catalog check, and the
# pre-commit quality suite land with T1.5c (R-PKG-11, ADR-007).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The payload consumes @platform/* via link:../platform (pre-registry
      # interim, T4.3 protocol) - provide the platform sibling checkout.
      # Obsolete once the first registry publish flips deps to ^0.2.0.
      - uses: actions/checkout@v4
        with:
          repository: oliverLubinus/platform
          # Default GITHUB_TOKEN is repo-scoped - it cannot read the platform
          # repo. Each fan-out repo creates its own PLATFORM_REPO_TOKEN
          # (fine-grained PAT, Contents: read-only on oliverLubinus/platform).
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: platform-checkout
          ref: main

      - name: "Provide the platform sibling (link: resolution target)"
        run: ln -s "$GITHUB_WORKSPACE/platform-checkout" ../platform

      - uses: pnpm/action-setup@v4
        # version resolved from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # dist/ is gitignored: build the sibling BEFORE the app install/typecheck
      - name: "Build the platform sibling (types come from its dist/, which is not committed)"
        run: cd ../platform && pnpm install --frozen-lockfile && pnpm -r build

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build