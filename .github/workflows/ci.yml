name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version resolved from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Packages' dist/ is gitignored - it must be BUILT before anything can
      # typecheck against @platform/* types. Order matters: build, then
      # typecheck, then test. The app-template build generates the Prisma
      # client first (its scripts are self-sufficient).
      - name: Build (packages -> dist, template client bundle)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
