packages:
  - 'packages/*'

# pnpm 11+ REPLACED onlyBuiltDependencies/neverBuiltDependencies with this
# allowBuilds map (the legacy `pnpm` field in package.json was dropped even
# earlier). strictDepBuilds defaults to true: an unreviewed build script
# fails the install with ERR_PNPM_IGNORED_BUILDS. esbuild ships a postinstall
# step (binary-check script); tsx depends on it.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
