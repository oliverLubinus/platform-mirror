packages:
  - 'packages/*'

# pnpm >= 10 reads build-script approvals HERE (the legacy `pnpm` field in
# package.json is no longer read — see pnpm.io/settings). esbuild ships a
# postinstall step (its binary-check script); tsx depends on it. Without
# this allow-list, CI fails with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
